<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vegetarian.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- عنوان الصفحة مع الوصف -->
    <title>AKLNY | Delicious Fast Food & Quick Delivery</title>

    <!-- وصف الموقع لـ SEO ومحركات البحث -->
    <meta
      name="description"
      content="Order your favorite fast food online with fast delivery and exclusive deals."
    />
    <script>
      (() => {
        try {
          // =========================
          // Theme
          // =========================

          const savedTheme = localStorage.getItem("theme");

          // Default = Dark
          const isDark = savedTheme ? savedTheme === "dark" : true;

          document.documentElement.classList.toggle("dark", isDark);

          // =========================
          // Language
          // =========================

          const savedLang = localStorage.getItem("i18nextLng");

          // Default = English
          const lang = savedLang?.startsWith("ar") ? "ar" : "en";

          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (error) {
          // Ignore localStorage errors
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
