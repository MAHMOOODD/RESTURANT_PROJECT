<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      (function () {
        try {
          var savedLang = localStorage.getItem('i18nextLng') || 'ar';
          var isRtl = savedLang.startsWith('ar');
          document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
          document.documentElement.lang = savedLang.startsWith('ar') ? 'ar' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
